# Supply-chain gate (issue #26, spec 005-assurance Requirement 3). Installed
# at zero runtime dependencies — the cheapest possible moment. Run via
# `make deny` / `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# #371/#374's rust-refine spike: `mvl` isn't published to crates.io,
# pinned instead to the same revision CI's mvl-limit gate already
# builds from GitHub (MVL_RUST_REV in .github/workflows/ci.yml).
allow-git = ["https://github.com/mvl-lang/mvl-rust"]
