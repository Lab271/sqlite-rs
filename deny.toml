# Supply-chain gate (issue #26, spec 005-assurance Requirement 3). Installed
# at zero runtime dependencies — the cheapest possible moment. Run via
# `make deny` / `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
