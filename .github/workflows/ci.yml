name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  # Must match `ORACLE_VERSION` in tests/corpus/oracle.rs and the pin in
  # tools/gen_fixtures.sh. The oracle diffs skip green when no sqlite3 of
  # exactly this version is found, so an unpinned runner would turn the
  # corpus job into theatre rather than a gate.
  SQLITE_ORACLE_VERSION: "3.53.3"
  SQLITE_ORACLE_TARBALL: "sqlite-autoconf-3530300"

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-deny

      # ubuntu-latest ships its own sqlite3, but never the pinned version,
      # and a mismatched oracle is worse than none: the Apple/system builds
      # disagree with upstream on CSV row terminators, which is exactly how
      # three CSV bugs reached main unnoticed (#55). Build the pin instead.
      - name: Cache pinned sqlite3 oracle
        id: cache-sqlite
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.local/sqlite-oracle
          key: sqlite-oracle-${{ env.SQLITE_ORACLE_VERSION }}-${{ runner.os }}
      - name: Build pinned sqlite3 oracle
        if: steps.cache-sqlite.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://sqlite.org/2026/${SQLITE_ORACLE_TARBALL}.tar.gz" -o sqlite.tar.gz
          tar xzf sqlite.tar.gz
          cd "${SQLITE_ORACLE_TARBALL}"
          ./configure --prefix="$HOME/.local/sqlite-oracle"
          make -j"$(nproc)"
          make install
      - name: Verify the oracle is the pinned, non-codec build
        run: |
          set -euo pipefail
          ORACLE="$HOME/.local/sqlite-oracle/bin/sqlite3"
          echo "ORACLE_SQLITE3=$ORACLE" >> "$GITHUB_ENV"
          found="$("$ORACLE" -version | awk '{print $1}')"
          if [ "$found" != "$SQLITE_ORACLE_VERSION" ]; then
            echo "error: oracle is $found, expected $SQLITE_ORACLE_VERSION"; exit 1
          fi
          if "$ORACLE" :memory: "PRAGMA compile_options;" | grep -qi codec; then
            echo "error: oracle is a codec build"; exit 1
          fi
          echo "oracle: $ORACLE ($found, non-codec)"

      - run: make test
      - run: make lint
      - run: make deny
      - run: make assurance-gate
      # Runs last: it is the slowest step in this job (~8s) and the only one
      # depending on the oracle built above.
      - run: make test-corpus
