name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-deny
      - run: make test
      - run: make lint
      - run: make deny

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage report
        id: coverage
        run: |
          make coverage
          cargo llvm-cov report > coverage-table.txt
          PERCENT=$(python3 -c "import json; print(round(json.load(open('target/llvm-cov.json'))['data'][0]['totals']['lines']['percent'], 2))")
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
      - name: Post coverage report to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- coverage-report -->"
          {
            echo "$marker"
            echo "## Coverage report"
            echo ""
            echo "Line coverage: **${{ steps.coverage.outputs.percent }}%** (gate: 75%)"
            echo ""
            echo '```'
            cat coverage-table.txt
            echo '```'
          } > comment-body.md
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@comment-body.md
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@comment-body.md
          fi
      - name: Enforce coverage threshold
        run: |
          percent="${{ steps.coverage.outputs.percent }}"
          awk -v p="$percent" 'BEGIN { exit (p + 0 >= 75) ? 0 : 1 }'
